name: churchpraise
description: "교회찬양집 - 성경, 새찬송가, 예배문 & 악보 뷰어"
publish_to: 'none'

version: 1.2.0+11

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfx: ^2.9.0
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.6.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#252560"
  adaptive_icon_foreground: "assets/app_icon_fg.png"
  remove_alpha_ios: true
  web:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/hymns_pdf/
    - assets/bible/ko_rev.json
    - assets/app_icon.png
    - assets/app_icon_fg.png
